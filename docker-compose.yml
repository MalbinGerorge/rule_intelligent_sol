services:
  neo4j:
    image: neo4j:5.24-community
    container_name: rule_intelligent_neo4j
    ports:
      - "7474:7474"   # browser UI (http://localhost:7474)
      - "7687:7687"   # bolt protocol (what the Python driver connects to)
    environment:
      # username is always "neo4j" — password set here. Change this
      # before running against anything beyond local dev, and keep it
      # out of version control the same way we treat the Postgres
      # password and QRadar token.
      - NEO4J_AUTH=neo4j/Sillywilly79**
      - NEO4J_PLUGINS=["apoc"]  # useful for graph algorithms later (e.g. blast-radius queries)
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16   # was: postgres:16
    container_name: rule_intelligent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sillywilly79**
      POSTGRES_DB: rule_intelligent_sol
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: rule_intelligent_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: rule_intelligent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rule_intelligent_redis_ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data: