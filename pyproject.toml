[project]
name = "rule-intelligent-sol"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "neo4j>=6.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.60",
    "jinja2>=3.1.6",
    "celery[redis]>=5.4.0",
    "pgvector>=0.3.0",
    "langsmith>=0.10.18",
    "flower>=2.1.0",
    "structlog>=26.1.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Only tests/ runs by default. evals/ hits real LLMs, QRadar and dev data
# and is run by hand: `uv run pytest evals/<suite>`.
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

# ADR 0001: imports only point downward. A layer may import any layer below
# it, never one above. "|" separates modules on the same level that must
# not import each other.
[[tool.importlinter.contracts]]
name = "Layers (ADR 0001)"
type = "layers"
layers = [
    "app.api",
    "app.workers",
    "app.services",
    "app.ai | app.ingestion",
    "app.repositories",
    "app.integrations",
    "app.db",
    "app.core",
]

# The three agents are separate products; shared AI code lives in
# app.ai.llm / app.ai.context, not in another agent.
[[tool.importlinter.contracts]]
name = "Agents are independent"
type = "independence"
modules = [
    "app.ai.agents.assistant",
    "app.ai.agents.rule_analyzer",
    "app.ai.agents.simulator",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # real errors: syntax, undefined names, unused imports/variables
    "I",                    # isort: consistent import order and grouping
    "UP",                   # pyupgrade: modern syntax for the target Python version
    "B",                    # bugbear: likely bugs and design traps
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in
# default arguments; they don't hold mutable state between requests.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# conftest must set environment variables before importing `app`.
"tests/conftest.py" = ["E402"]
# Standalone scripts adjust sys.path / os.environ before importing `app`.
"scripts/**" = ["E402"]
