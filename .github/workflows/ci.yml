# Continuous Integration: runs on every pull request into development/main
# and on every push to those branches (i.e. after a merge).
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# If you push again to the same PR while CI is still running, cancel the
# old run -- only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Third-party actions are pinned to a full commit SHA, not a tag: a tag
    # can be moved to different code later, a SHA can't. The comment keeps
    # the human-readable version next to it.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --only-group dev installs just the dev tools (ruff, pytest) at the
      # versions pinned in uv.lock -- not the app's heavy dependencies
      # (torch, sentence-transformers, ...), which linting doesn't need.
      # --output-format=github turns findings into inline PR annotations.
      - name: Ruff lint
        run: uv run --only-group dev ruff check --output-format=github .

      # --check only reports; it never rewrites files in CI. Fix locally
      # with `uv run ruff format .`
      - name: Ruff format
        run: uv run --only-group dev ruff format --check --diff .

      # Architecture rules from docs/adr/0001: layers only import downward,
      # agents stay independent. Contracts are in pyproject.toml.
      - name: Import contracts (import-linter)
        run: uv run --only-group dev lint-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres started next to the job, using the same image as
    # docker-compose. It exists only for this run and is deleted afterwards.
    # The health check makes the job wait until Postgres accepts connections.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # There is no .env in CI: settings come from these environment variables
    # (environment variables take precedence over .env anyway). They are
    # throwaway values for the container above, not real secrets. The app
    # requires the Neo4j/Redis/encryption settings to start even though the
    # tests don't use those services yet.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ci-only-postgres-password
      NEO4J_PASSWORD: ci-only-unused
      REDIS_PASSWORD: ci-only-unused
      TOKEN_ENCRYPTION_KEY: ci-only-unused

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # enable-cache keeps uv's download cache between runs, keyed on
      # uv.lock, so unchanged dependencies aren't downloaded again.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently resolving new versions.
      - name: Install dependencies
        run: uv sync --locked

      # tests/conftest.py creates rule_intelligent_sol_test on this server,
      # runs `alembic upgrade head`, then the tests run against it.
      - name: Run tests
        run: uv run pytest -ra

  security:
    name: Security (gitleaks, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 fetches the full history, so gitleaks scans every
      # commit -- a secret added and deleted again within a PR still leaks.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Rules: .gitleaks.toml (built-in rules + a hardcoded-password rule).
      # Accepted historical findings: .gitleaksignore (each with a reason).
      # --redact keeps secret values out of the CI log. The image is pinned
      # by digest for the same reason actions are pinned by SHA. The
      # safe.directory setting lets git inside the container read a checkout
      # owned by a different user.
      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --no-banner --verbose

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Audits every locked dependency (app + dev tools) against known
      # vulnerabilities. --require-hashes/--disable-pip: audit exactly the
      # versions in uv.lock without installing anything.
      #
      # Accepted, with no fix available (review again 2026-12-31, or drop
      # once Chroma is replaced by pgvector):
      #   chromadb PYSEC-2026-311, -3813, -3814, -3815 -- code execution via
      #   trust_remote_code and missing tenant checks, all in the Chroma
      #   SERVER. Ours runs in Docker bound to 127.0.0.1 only, single-tenant,
      #   and the app uses chromadb as a client without trust_remote_code.
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --only-group dev pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
