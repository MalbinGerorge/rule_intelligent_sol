# Continuous Integration: runs on every pull request into development/main
# and on every push to those branches (i.e. after a merge).
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# If you push again to the same PR while CI is still running, cancel the
# old run -- only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Third-party actions are pinned to a full commit SHA, not a tag: a tag
    # can be moved to different code later, a SHA can't. The comment keeps
    # the human-readable version next to it.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --only-group dev installs just the dev tools (ruff, pytest) at the
      # versions pinned in uv.lock -- not the app's heavy dependencies
      # (torch, sentence-transformers, ...), which linting doesn't need.
      # --output-format=github turns findings into inline PR annotations.
      - name: Ruff lint
        run: uv run --only-group dev ruff check --output-format=github .

      # --check only reports; it never rewrites files in CI. Fix locally
      # with `uv run ruff format .`
      - name: Ruff format
        run: uv run --only-group dev ruff format --check --diff .
