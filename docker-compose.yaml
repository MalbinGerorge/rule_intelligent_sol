# Local development stack. Every secret comes from .env (see .env.example);
# `docker compose up` refuses to start if one is missing.
#
# All ports are bound to 127.0.0.1 so these services are reachable from
# this machine only, not from the rest of the network.
#
# NOTE: Postgres and Neo4j only apply their password env vars when the
# data volume is first created. Changing POSTGRES_PASSWORD / NEO4J_PASSWORD
# in .env later does NOT change the password of an existing volume -- run
# ALTER USER (Postgres) / ALTER CURRENT USER SET PASSWORD (Neo4j) as well.
services:
  neo4j:
    image: neo4j:5.24-community
    container_name: rule_intelligent_neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser UI (http://localhost:7474)
      - "127.0.0.1:7687:7687"   # bolt protocol (what the Python driver connects to)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      - NEO4J_PLUGINS=["apoc"]  # useful for graph algorithms later (e.g. blast-radius queries)
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16   # was: postgres:16
    container_name: rule_intelligent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-rule_intelligent_sol}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: rule_intelligent_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: rule_intelligent_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rule_intelligent_redis_ui
    restart: unless-stopped
    environment:
      # label:host:port:db:password
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:8082:8081"

  chroma:
    image: chromadb/chroma
    container_name: rule_intelligent_chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:
  chroma_data:
